name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build Signed Release APK with Proprietary License Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4

      - name: Checkout proprietary license repository
        uses: actions/checkout@v4
        with:
          repository: onprs/Onprs-Encryption
          ssh-key: ${{ secrets.LICENSE_REPO_SSH_KEY }}
          path: private/Onprs-Encryption

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36, NDK, and CMake
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Prepare release signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 secret for release signing." >&2
            exit 1
          fi
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/release.keystore" >> "${GITHUB_ENV}"

      - name: Run release unit tests and assemble signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew checkCoreContracts testReleaseUnitTest assembleRelease --no-daemon

      - name: Package release assets and generate update-manifest.json
        env:
          TAG_NAME: ${{ github.ref_name }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          mkdir -p release-assets
          APK_SOURCE="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "${APK_SOURCE}" ]; then
            echo "Expected signed APK not found at ${APK_SOURCE}" >&2
            exit 1
          fi

          git fetch origin "refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}" --force --quiet
          VERSION_NAME="${TAG_NAME#v}"
          APK_FILENAME="university-toolbox-${TAG_NAME}.apk"
          cp "${APK_SOURCE}" "release-assets/${APK_FILENAME}"

          APK_SHA256="$(sha256sum "release-assets/${APK_FILENAME}" | awk '{print $1}')"
          VERSION_CODE="$(grep -E 'versionCode\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/[^0-9]//g')"
          APK_URL="https://github.com/${REPO_SLUG}/releases/download/${TAG_NAME}/${APK_FILENAME}"

          python3 - <<'PY' "${VERSION_CODE}" "${VERSION_NAME}" "${TAG_NAME}" "${APK_URL}" "${APK_SHA256}" "release-assets/update-manifest.json" "release-assets/release-notes.md"
          import json
          import subprocess
          import sys

          version_code = int(sys.argv[1])
          version_name = sys.argv[2]
          tag_name = sys.argv[3]
          apk_url = sys.argv[4]
          sha256 = sys.argv[5]
          manifest_path = sys.argv[6]
          notes_path = sys.argv[7]

          raw_notes = subprocess.check_output(
              ["git", "tag", "-l", "--format=%(contents)", tag_name],
              text=True,
              encoding="utf-8",
          ).strip()
          if not raw_notes:
              raw_notes = f"University-ToolBox {version_name}"

          with open(notes_path, "w", encoding="utf-8") as fp:
              fp.write(raw_notes + "\n")

          manifest = {
              "channel": "stable",
              "latestVersionCode": version_code,
              "latestVersionName": version_name,
              "minSupportedVersionCode": version_code,
              "apkUrl": apk_url,
              "sha256": sha256,
              "changelog": raw_notes,
              "disabledTools": {},
              "revokedSerialIds": [],
          }
          with open(manifest_path, "w", encoding="utf-8") as fp:
              json.dump(manifest, fp, ensure_ascii=False, indent=2)
              fp.write("\n")
          PY

      - name: Cleanup temporary keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.keystore"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: University-ToolBox ${{ github.ref_name }}
          body_path: release-assets/release-notes.md
          generate_release_notes: false
          files: |
            release-assets/*.apk
            release-assets/update-manifest.json
